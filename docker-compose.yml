version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: worksure-db
    environment:
      POSTGRES_USER: worksure
      POSTGRES_PASSWORD: worksure_dev_pass
      POSTGRES_DB: worksure_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worksure -d worksure_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: worksure-api
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://worksure:worksure_dev_pass@postgres:5432/worksure_dev
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
